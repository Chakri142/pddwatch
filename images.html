<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelioGuard - Design Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="images.css">
</head>
<body>
    <div class="top-nav">
        <a href="index.html" class="back-btn"><i class="ph-bold ph-arrow-left"></i> Back to Prototype</a>
        <h1>Product Design Gallery</h1>
        <div style="width: 100px;"></div> <!-- Spacer for centering -->
    </div>

    <div class="gallery-container">
        <!-- Main Image Viewer -->
        <div class="main-image-wrapper">
            <!-- Using img1.jpg as the default image -->
            <img id="main-display" src="img1.jpg" alt="HelioGuard Design" class="slide-in" onerror="this.src='https://images.unsplash.com/photo-1616423640778-28d1b53229bd?auto=format&fit=crop&q=80&w=1000';">
            
            <div class="glass-overlay">
                <h3 id="image-title">Component Structure</h3>
                <p id="image-desc">Detailed view of the HelioGuard smartwatch features.</p>
            </div>
            
            <button class="nav-arrow left" onclick="prevImage()"><i class="ph-bold ph-caret-left"></i></button>
            <button class="nav-arrow right" onclick="nextImage()"><i class="ph-bold ph-caret-right"></i></button>
        </div>

        <!-- Thumbnails -->
        <div class="thumbnails" id="thumbnail-container">
            <!-- Thumbnails are generated by JS -->
        </div>
    </div>

    <script src="images.js"></script>
</body>
</html>
